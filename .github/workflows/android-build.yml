name: Android Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        if: inputs.build_type == 'debug'
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: inputs.build_type == 'release'
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: puffy-ai-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "## Puffy AI Kotlin APK" >> $GITHUB_STEP_SUMMARY
          echo "- Type: **${{ inputs.build_type }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Application ID: \`com.blitzlabx.puffy\`" >> $GITHUB_STEP_SUMMARY
          echo "- Created by **Blitz** (blitzlabx)" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs -name "*.apk" -exec ls -lh {} \; || true
